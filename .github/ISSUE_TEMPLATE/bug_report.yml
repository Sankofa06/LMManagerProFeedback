name: Bug report
description: Report something that is broken or not working as expected.
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LM Manager Pro. Please avoid sharing API keys, tokens, private hostnames, or personal data.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Machine status does not refresh after adding a server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that trigger the problem.
      placeholder: |
        1. Open Machines
        2. Add a local LM Studio server
        3. Tap Check Status
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS version, LM Manager Pro version, and relevant LM Studio version.
      placeholder: iPhone 17 Pro Max, iOS 26.5, LM Manager Pro 1.0.0, LM Studio 0.x
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots, logs, or other context. Do not include secrets.
