<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LM Manager Pro — Feedback</title>
  <meta name="description" content="Browse, upvote, and submit feature requests and bug reports for LM Manager Pro." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <img src="assets/icon.svg" alt="" />
        LM Manager Pro
      </a>
      <nav class="site-nav">
        <a href="./" class="active">Feedback</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Feedback</h1>
    <p class="tagline">
      Browse open requests, upvote what matters to you, and submit new ideas.
    </p>

    <div class="toolbar" role="region" aria-label="Filter and sort">
      <input
        type="search"
        id="search-input"
        placeholder="Search feedback…"
        aria-label="Search feedback"
      />
      <label>
        Sort
        <select id="sort-select" aria-label="Sort">
          <option value="top">Top (👍)</option>
          <option value="newest">Newest</option>
          <option value="comments">Most discussed</option>
        </select>
      </label>
      <label>
        Label
        <select id="label-select" aria-label="Filter by label">
          <option value="">All labels</option>
        </select>
      </label>
      <label>
        State
        <select id="state-select" aria-label="Filter by state">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="closed">Closed</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="submit-btn" class="btn primary">+ Submit Feedback</button>
    </div>

    <div id="status-banner" role="status" hidden></div>

    <ul id="issue-list" aria-live="polite"></ul>

    <dialog id="submit-modal" aria-labelledby="modal-title">
      <form id="submit-form">
        <h2 id="modal-title">Submit Feedback</h2>
        <label>
          Type
          <select id="issue-type">
            <option value="feature request">Feature Request</option>
            <option value="bug">Bug Report</option>
          </select>
        </label>
        <label>
          Title <span class="required" aria-hidden="true">*</span>
          <input type="text" id="issue-title" required maxlength="200" placeholder="Brief description…" />
        </label>
        <label>
          Details <span class="optional">(optional)</span>
          <textarea id="issue-body" rows="5" placeholder="Steps to reproduce, expected behaviour, etc."></textarea>
        </label>
        <p id="modal-error" class="modal-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn">Cancel</button>
          <button type="submit" id="modal-submit" class="btn primary">Submit</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>
      <a href="privacy.html">Privacy Policy</a> ·
      <a id="repo-link" href="#" target="_blank" rel="noopener">GitHub Repo</a>
    </p>
    <p>© LM Manager Pro</p>
  </footer>

  <script src="assets/feedback.js" defer></script>
</body>
</html>
