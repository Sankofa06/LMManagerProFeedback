<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LM Manager Pro">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0d14"/>
  <polygon points="56,32 44,11.2 20,11.2 8,32 20,52.8 44,52.8"
    fill="none" stroke="#1a3a3a" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="30" x2="16" y2="34" stroke="#00cc66" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="30" x2="48" y2="16" stroke="#2299cc" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="30" x2="50" y2="46" stroke="#88aa44" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="30" x2="30" y2="50" stroke="#44bb88" stroke-width="1" opacity="0.6"/>
  <line x1="48" y1="16" x2="50" y2="46" stroke="#3399bb" stroke-width="1" opacity="0.5"/>
  <circle cx="16" cy="34" r="4" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="48" cy="16" r="5" fill="#4db8ff" filter="url(#glow)"/>
  <circle cx="50" cy="46" r="5" fill="#ffaa33" filter="url(#glow)"/>
  <circle cx="30" cy="50" r="2.5" fill="#c8e8ff" filter="url(#glow)"/>
  <circle cx="32" cy="30" r="7.5" fill="#00ff88" filter="url(#glow-strong)"/>
</svg>
